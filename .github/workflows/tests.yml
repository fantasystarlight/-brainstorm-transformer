name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read        # 最小权限：CI 只需要读代码

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # full    : 全部可选依赖（tokenizers / regex / torch-cpu）
        # minimal : 故意**不装** tokenizers/regex，验证「手写 BPE 后备路径」在裸环境也能跑
        #           （torch 仍要装，因为模型不变量测试本身依赖它）
        variant: [full, minimal]
    env:
      PYTHONPATH: .
      MPLCONFIGDIR: /tmp/mplconfig-dsh   # matplotlib 默认缓存目录在 CI 上不可写
      # CI runner 没有中文字体 → 渲染器会降级成英文标签，测试按降级模式断言（见 test_flowchart.py）
    steps:
      - uses: actions/checkout@v4

      # 刻意不用 actions/setup-python：它要额外下载一份 Python 工具链，
      # 在受限网络下会随机失败（本仓库的 CI 就因此失败过两次）。
      # ubuntu-latest 自带 Python 3.10+，够用了。
      - name: 确认自带的 Python
        run: |
          python3 --version
          python3 -c "import sys; assert sys.version_info >= (3, 10), sys.version"

      - name: 安装依赖
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install numpy pytest matplotlib
          if [ "${{ matrix.variant }}" = "full" ]; then
            python3 -m pip install tokenizers regex
          else
            echo "minimal 线：故意不装 tokenizers / regex"
          fi

      - name: 核心不变量测试（模型/分词/因果性/cache/GQA）
        run: python3 -m pytest transformer/test_mini_transformer.py -q --no-header

      - name: 流程图守卫测试（transformer 侧）
        run: python3 -m pytest transformer/test_flowchart.py -q --no-header

      - name: 流程图守卫测试（工作区根目录）
        run: python3 -m pytest test_flowchart.py -q --no-header

      - name: 端到端冒烟（只有 full 线跑）
        if: matrix.variant == 'full'
        run: |
          # --datadir 指到被 gitignore 的目录：不污染仓库
          python3 -m transformer.train --quick --datadir data_ci --tag ci
          python3 -m transformer.generate --datadir data_ci --tag ci -n 32 --temperature 0.8

      - name: 失败时把 pytest 输出写进日志尾部（方便不登录也能看到摘要）
        if: failure()
        run: |
          echo "::group::常见原因速查"
          echo "1) 缺中文字体 → 只有 test_flowchart 的字形断言会失败；测试已按降级模式处理"
          echo "2) minimal 线没装 tokenizers → 应走 transformer/bpe.py 手写后备，属预期"
          echo "3) 端到端冒烟需要 torch + tokenizers"
          echo "::endgroup::"

      - name: 环境信息
        if: always()
        continue-on-error: true
        run: |
          python3 -c "import sys; print(sys.version)"
          python3 -c "import numpy; print('numpy', numpy.__version__)"
          python3 -c "import torch; print('torch', torch.__version__)"
          python3 -c "import tokenizers; print('tokenizers', tokenizers.__version__)" 2>/dev/null || echo "tokenizers: 未安装（minimal 线，符合预期）"
          python3 -c "import regex; print('regex', regex.__version__)" 2>/dev/null || echo "regex: 未安装（minimal 线，符合预期）"
