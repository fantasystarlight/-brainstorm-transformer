name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # full    : 全部可选依赖（tokenizers / regex / torch-cpu）
        # minimal : 故意**不装** tokenizers/regex，验证「手写 BPE 后备路径」在裸环境也能跑
        #           （torch 还是要装，因为模型不变量测试本身需要它）
        variant: [full, minimal]
    env:
      PYTHONPATH: .
      MPLCONFIGDIR: /tmp/mplconfig-dsh   # matplotlib 默认缓存目录在 CI 上不可写
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest matplotlib
          if [ "${{ matrix.variant }}" = "full" ]; then
            pip install tokenizers regex
          else
            echo "minimal 线：故意不装 tokenizers / regex"
          fi

      - name: 核心不变量测试（模型/分词/因果性/cache/GQA）
        run: |
          pytest transformer/test_mini_transformer.py -q --no-header 2>&1 | tee /tmp/t1.log
          exit ${PIPESTATUS[0]}

      - name: 流程图守卫测试（transformer 侧）
        run: |
          pytest transformer/test_flowchart.py -q --no-header 2>&1 | tee /tmp/t2.log
          exit ${PIPESTATUS[0]}

      - name: 流程图守卫测试（工作区根目录）
        run: |
          pytest test_flowchart.py -q --no-header 2>&1 | tee /tmp/t3.log
          exit ${PIPESTATUS[0]}

      - name: 端到端冒烟（只有 full 线跑，需要 torch + tokenizers）
        if: matrix.variant == 'full'
        run: |
          python -m transformer.train --quick --tag ci 2>&1 | tail -20
          python -m transformer.generate --tag ci -n 32 --temperature 0.8 2>&1 | tail -12

      - name: 失败时把 pytest 输出写进 Actions 摘要（不登录也能看到原因）
        if: failure()
        run: |
          {
            echo "### pytest 输出（${{ matrix.variant }}）"
            for f in /tmp/t1.log /tmp/t2.log /tmp/t3.log; do
              [ -f "$f" ] || continue
              echo "<details><summary>$f</summary>"
              echo ""
              echo '```'
              tail -60 "$f"
              echo '```'
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 环境信息
        if: always()
        run: |
          python -c "import sys; print(sys.version)"
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import torch; print('torch', torch.__version__)"
          python -c "import tokenizers; print('tokenizers', tokenizers.__version__)" 2>/dev/null || echo "tokenizers: 未安装（minimal 线，符合预期）"
          python -c "import regex; print('regex', regex.__version__)" 2>/dev/null || echo "regex: 未安装（minimal 线，符合预期）"
